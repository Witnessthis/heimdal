services:
  heimdal:
    build: .
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-}
      # Without this, getModel() (src/ai/model.ts) falls back to its dev
      # default of 127.0.0.1:11434 — this container's own loopback, where
      # nothing listens, since Ollama runs in the separate `ollama`
      # service below. Must include the /v1 path segment; see that
      # file's own comment for why.
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ./data:/app/data
      # Caddy's own storage (its Let's Encrypt cert/account state) — not
      # under /app/data, and not persisted otherwise. Without this,
      # every container recreation (a plain restart is fine; a redeploy
      # that recreates the container isn't) loses the cert and requests
      # a brand-new one from Let's Encrypt, which is exactly the kind of
      # thing that trips their per-domain rate limit if it happens more
      # than a few times. Path matches the "heimdal" user's home
      # directory Caddy defaults to (see Dockerfile's adduser call).
      - caddy-data:/home/heimdal/.local/share/caddy
    restart: unless-stopped

  # Local LLM backend — a separate concern from Heimdal itself (see
  # README.md "Local AI models (Ollama)"). Heimdal reaches it at
  # http://ollama:11434 over the Compose network; nothing outside this
  # machine can reach it, since the port below is bound to loopback only
  # (127.0.0.1), not 0.0.0.0 — it has no authentication of its own.
  # mem_limit caps it well under the Pi's 8GB total, leaving headroom for
  # the OS and the heimdal container; drop this line entirely on a bigger
  # machine, or raise it if a larger model needs more.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 6g
    restart: unless-stopped

volumes:
  ollama-models:
  caddy-data:
